name: TikTok Monitor

on:
  schedule:
    # 設定為每天執行兩次（你可以自行調整時間）
    - cron: '0 8,20 * * *'
  workflow_dispatch: # 允許你隨時在網頁上手動點擊執行

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 取得專案程式碼與名單
        uses: actions/checkout@v4

      - name: 2. 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 安裝 yt-dlp
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: 4. 執行監控腳本
        run: python monitor.py

      - name: 5. 自動將更新後的歷史紀錄推回專案
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update archive log"
          file_pattern: "archive.txt"
